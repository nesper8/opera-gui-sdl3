name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag and release, without the leading v (for example 0.1.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Create version tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_TAG)) {
              throw new Error("Version must use semantic version format, such as 0.1.1 or 0.1.1-rc.1.");
            }

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${process.env.RELEASE_TAG}`,
              sha: context.sha
            });

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target opera_frontend settings_tests --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $PWD "package"
          New-Item -ItemType Directory -Force -Path $packageDirectory | Out-Null
          Copy-Item "build/opera_frontend.exe" $packageDirectory
          Copy-Item "build/SDL3.dll" $packageDirectory
          Copy-Item "README.md" $packageDirectory

          $archive = "OperaSDL3Frontend-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -Path (Join-Path $packageDirectory "*") -DestinationPath $archive -Force
          if (-not (Test-Path $archive)) {
            throw "Release archive was not created: $archive"
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: OperaSDL3Frontend-${{ env.RELEASE_TAG }}-windows-x64.zip
