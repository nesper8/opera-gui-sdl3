name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag and release, without the leading v (for example 0.1.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Create version tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const tagName = process.env.RELEASE_TAG;
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tagName)) {
              throw new Error("Version must use semantic version format, such as 0.1.1 or 0.1.1-rc.1.");
            }

            async function verifyExistingTag() {
              const { data: ref } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`
              });
              let target = ref.object;
              while (target.type === "tag") {
                const { data: annotatedTag } = await github.rest.git.getTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_sha: target.sha
                });
                target = annotatedTag.object;
              }
              if (target.type !== "commit" || target.sha !== context.sha) {
                throw new Error(`Tag ${tagName} already exists and does not point to this workflow's commit.`);
              }
            }

            try {
              await verifyExistingTag();
              core.info(`Tag ${tagName} already points to this commit; continuing with the release.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tagName}`,
                  sha: context.sha
                });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
                await verifyExistingTag();
                core.info(`Tag ${tagName} was created by another workflow run; continuing with the release.`);
              }
            }

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore or save compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build --target opera_frontend settings_tests --parallel

      - name: Show compiler cache statistics
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $PWD "package"
          New-Item -ItemType Directory -Force -Path $packageDirectory | Out-Null
          Copy-Item "build/opera_frontend.exe" $packageDirectory
          Copy-Item "build/SDL3.dll" $packageDirectory
          Copy-Item "README.md" $packageDirectory

          $archive = "OperaSDL3Frontend-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -Path (Join-Path $packageDirectory "*") -DestinationPath $archive -Force
          if (-not (Test-Path $archive)) {
            throw "Release archive was not created: $archive"
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: OperaSDL3Frontend-${{ env.RELEASE_TAG }}-windows-x64.zip
